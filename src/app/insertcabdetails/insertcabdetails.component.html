<!DOCTYPE html>
<html>
<head>
    <title>Call a Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-area">
        <div class="page-header">
            <h1>Call a Ride</h1>
            <a href="/edit">Go Back to My Rides</a>
        </div>

        <div id="map"></div>

        <form (ngSubmit)="insertData()">
            <div class="form-group">
                <label for="FromLocationInput">From Location</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="FromLocationInput" placeholder="Enter starting point" [formControl]="fromLocation" />
                    <div *ngIf="isLoading">Loading...</div>
                    <ul class="suggestions-list" *ngIf="suggestions.length > 0">
                        <li *ngFor="let suggestion of suggestions" (click)="onSelectSuggestion(suggestion, true)">
                            {{ suggestion.display_name }}
                        </li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="ToLocationInput">To Location</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="ToLocationInput" placeholder="Enter destination" [formControl]="toLocation" />
                    <div *ngIf="isLoading1">Loading...</div>
                    <ul class="suggestions-list" *ngIf="suggestions1.length > 0">
                        <li *ngFor="let suggestion of suggestions1" (click)="onSelectSuggestion(suggestion, false)">
                            {{ suggestion.display_name }}
                        </li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="DateInput">Date</label>
                <input type="date" id="DateInput" [formControl]="date" [min]="today.date" [max]="today['30days']" />
            </div>

            <div class="form-group">
                <label for="TimeInput">Time</label>
                <input type="time" id="TimeInput" [formControl]="time" />
            </div>

            <div class="form-group">
                <label for="NumPassengersInput">Number Of Passengers</label>
                <input type="number" id="NumPassengersInput" [formControl]="numpassengers" min="1" max="4" />
            </div>

            <div class="form-group">
                <label for="AgesInput">Ages (comma-separated)</label>
                <input type="text" id="AgesInput" [formControl]="ages" placeholder="e.g., 25, 30, 5" />
            </div>

            <div class="form-actions">
                <button type="button" id="tryRoute" class="btn btn-secondary">Test Route</button>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>

            <div>
                <p id="errormsg"></p>
            </div>
        </form>
    </div>
</body>
</html>
