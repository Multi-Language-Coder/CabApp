<!DOCTYPE html>
<html>

<head>
    <title>Update Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="content-area">
        <div class="top-nav">
            <a href="/login">Sign Out</a>
            <a href="/profilePage">Go Back</a>
        </div>

        <h1>Update Page</h1>

        <form id="form">
            <div class="form-group">
                <label for="NameInput">Name</label>
                <input type="text" id="NameInput" required placeholder="Boubacar Thiam" [formControl]="name" />
            </div>

            <div class="form-group">
                <label for="PasswordInput">Previous Password</label>
                <div class="password-wrapper">
                    <input type="password" id="PasswordInput" required placeholder="Enter your previous password" [formControl]="prevPassword" />
                    <button type="button" class="btn" (click)="showPassword1()"><i class="fa fa-eye"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label for="PasswordInput1">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="PasswordInput1" required placeholder="Enter your new password" [formControl]="password" />
                    <button type="button" class="btn" (click)="showPassword()"><i class="fa fa-eye"></i></button>
                </div>
                <p class="reminder">You can keep the same password by re-entering it.</p>
            </div>

            <div class="form-group">
                <label for="DescriptionInput">Description</label>
                <textarea id="DescriptionInput" required placeholder="Tell us about yourself" [formControl]="description"></textarea>
            </div>

            <div *ngIf="driver">
                <div class="form-group">
                    <label for="year">Car Year</label>
                    <select required id="year" (change)="yearUpdate()">
                        <option selected>Please select the year</option>
                        <option value="1992">1992</option>
                    <option value="1993">1993</option>
                    <option value="1994">1994</option>
                    <option value="1995">1995</option>
                    <option value="1996">1996</option>
                    <option value="1997">1997</option>
                    <option value="1998">1998</option>
                    <option value="1999">1999</option>
                    <option value="2000">2000</option>
                    <option value="2001">2001</option>
                    <option value="2002">2002</option>
                    <option value="2003">2003</option>
                    <option value="2004">2004</option>
                    <option value="2005">2005</option>
                    <option value="2006">2006</option>
                    <option value="2007">2007</option>
                    <option value="2008">2008</option>
                    <option value="2009">2009</option>
                    <option value="2010">2010</option>
                    <option value="2011">2011</option>
                    <option value="2012">2012</option>
                    <option value="2013">2013</option>
                    <option value="2014">2014</option>
                    <option value="2015">2015</option>
                    <option value="2016">2016</option>
                    <option value="2017">2017</option>
                    <option value="2018">2018</option>
                    <option value="2019">2019</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                        </select>
                </div>
                <div class="form-group">
                    <label for="make">Car Make</label>
                    <select required id="make" (change)="makeUpdate()">
                        <option selected>Please select the make</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model">Car Model</label>
                    <select required id="model">
                        <option selected>Please select the model</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="states">State</label>
                    <select required id="states" (change)="updateTowns()">
                        <option selected>Please select a state</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="towns">Town</label>
                    <select required id="towns">
                        <option selected>Please select a town</option>
                    </select>
                </div>
            </div>

            <div class="camera">
                <video id="video">Video stream not available.</video>
                <button id="start-button" class="btn-submit">Take photo</button>
            </div>

            <canvas id="canvas"></canvas>

            <div class="output">
                <img id="photo" alt="Your captured photo will appear here." />
                <button id="postPhoto" class="btn-submit">Submit Details</button>
            </div>
        </form>
    </div>
</body>

</html>
