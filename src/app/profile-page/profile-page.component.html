<!DOCTYPE html>
<html>

<head>
    <title>User Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="profile-container">
        <div class="top-nav">
            <a href="/signup">Sign Up</a>
            <a href="/picture">Update Details</a>
            <a *ngIf="!driver" href="/edit">Edit Page</a>
            <a *ngIf="driver" href="/driver">Driver Page</a>
        </div>

        <div class="profile-image-wrapper">
            <img [src]="imageLink || 'https://static.thenounproject.com/png/5034901-200.png'" alt="Profile Picture">
        </div>
        <h1 class="user-name">{{user.name}}</h1>
        
        <p class="user-username">&#64;{{user.username}}</p>

        <div class="profile-details">
            <div class="detail-item">
                <span class="detail-label">Description:</span>
                <span class="detail-value">{{user.description}}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Password:</span>
                <span class="detail-value">{{user.password}}</span>
            </div>

            <ng-container *ngIf="user.isDriver">
                <div class="detail-item">
                    <span class="detail-label">Location:</span>
                    <span class="detail-value">{{user.town}}, {{user.state}}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Car Model:</span>
                    <span class="detail-value">{{user.carType}}</span>
                </div>
            </ng-container>
        </div>

        <div id="err" class="alert alert-danger"></div>
    </div>
</body>

</html>
