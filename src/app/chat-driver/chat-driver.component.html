<div *ngIf="!chatAvailable">
    <h3 class="chat-header">No chat available</h3>
</div>

<div *ngIf="chatAvailable">
    <h3 class="chat-header">Speaking to: <span>{{driverUser}}</span></h3>
    
    <div id="messages">
        @for(message of messages; track trackByMessageIndex($index,message)){
            <div class="message">
                <strong>{{message.sender}}:</strong> {{message.text}}
            </div>
        }
    </div>
    
    <div id="chat-input">
        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            [(ngModel)]="newMessage"
            (keyup.enter)="sendMessage()"
        />
        <div class="button-group">
            <button
                class="btn btn-primary"
                (click)="sendMessage()">
                Send
            </button>
            <button
                class="btn btn-danger"
                (click)="endChat()">
                End Chat
            </button>
        </div>
    </div>
</div>
