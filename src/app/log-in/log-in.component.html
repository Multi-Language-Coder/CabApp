<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hail - Log In</title>
    <style>
        /* --- Basic Reset & Font --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0e5ec; /* A neutral, soft background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a5568;
        }

        /* --- Main Login Container --- */
        .login-container {
            background-color: #f7fafc;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* --- Header Section --- */
        .login-header {
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }
        
        .logo .icon {
            display: inline-block;
            transform: translateY(2px);
            margin-left: 5px;
        }

        .title {
            font-size: 2.25rem;
            font-weight: 700;
            color: #1a202c;
        }

        .subtitle {
            font-size: 1rem;
            color: #718096;
            margin-top: 0.25rem;
        }

        /* --- Form Styling --- */
        .login-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.5);
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.875rem;
            color: #4299e1;
            text-decoration: none;
            margin-top: -0.75rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #2b6cb0;
        }
        
        /* --- Submit Button --- */
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background-image: linear-gradient(to right, #2d3748 0%, #4a5568 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }

        .submit-btn .arrow {
            margin-left: 8px;
            transition: transform 0.2s;
        }

        .submit-btn:hover .arrow {
            transform: translateX(3px);
        }

        /* --- Footer Section --- */
        .signup-link {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #718096;
        }

        .signup-link a {
            color: #4299e1;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .signup-link a:hover {
            color: #2b6cb0;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1 class="logo">
                =HAIL 
                <span class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5H15V3C15 2.45 14.55 2 14 2H10C9.45 2 9 2.45 9 3V5H6.5C5.84 5 5.28 5.42 5.08 6.01L3 12V19C3 19.55 3.45 20 4 20H5C5.55 20 6 19.55 6 19V18H18V19C18 19.55 18.45 20 19 20H20C20.55 20 21 19.55 21 19V12L18.92 6.01ZM6.5 16C5.67 16 5 15.33 5 14.5C5 13.67 5.67 13 6.5 13C7.33 13 8 13.67 8 14.5C8 15.33 7.33 16 6.5 16ZM17.5 16C16.67 16 16 15.33 16 14.5C16 13.67 16.67 13 17.5 13C18.33 13 19 13.67 19 14.5C19 15.33 18.33 16 17.5 16ZM5.81 10L7.5 6.5H16.5L18.19 10H5.81Z" fill="#2D3748"/>
                    </svg>
                </span>
            </h1>
            <h2 class="title">Log In</h2>
            <p class="subtitle">Your Journey Starts Here</p>
        </div>

        <form class="login-form" (ngSubmit)="login()" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" [formControl]="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [formControl]="password" placeholder="••••••••">
            </div>
            
            <a href="#" class="forgot-password">Forgot Password?</a>
            
            <button type="submit" class="submit-btn">
                Submit 
                <span class="arrow">→</span>
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>

</body>
</html>
