<!DOCTYPE html>
<html>
<head>
    <title>Update Cab Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-area">
        <div id="divMsg" class="alert alert-info"></div>

        <div class="page-header">
            <h1>Update Cab Details</h1>
            <a id="gb" href="/edit/">Go Back</a>
        </div>

        <div id="googleMap"></div>

        <form (ngSubmit)="update()">
            <div class="form-group">
                <label for="FromLocationInput">From Location</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="FromLocationInput" placeholder="Shibuya Station" [formControl]="fromLocation" />
                    <div *ngIf="isLoading">Loading...</div>
                    <ul class="suggestions-list" *ngIf="suggestions.length > 0">
                        <li *ngFor="let suggestion of suggestions" (click)="onSelectSuggestion(suggestion, true)">
                            {{ suggestion.display_name }}
                        </li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="ToLocationInput">To Location</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="ToLocationInput" placeholder="Mt. Fuji" [formControl]="toLocation" />
                    <div *ngIf="isLoading1">Loading...</div>
                    <ul class="suggestions-list" *ngIf="suggestions1.length > 0">
                        <li *ngFor="let suggestion of suggestions1" (click)="onSelectSuggestion(suggestion, false)">
                            {{ suggestion.display_name }}
                        </li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="DateInput">Date</label>
                <input type="date" id="DateInput" [formControl]="date" />
            </div>

            <div class="form-group">
                <label for="TimeInput">Time</label>
                <input type="time" id="TimeInput" [formControl]="time" />
            </div>

            <div class="form-group">
                <label for="NumPassengersInput">Number Of Passengers</label>
                <input type="number" id="NumPassengersInput" [formControl]="numpassengers" />
            </div>

            <div class="form-group">
                <label for="AgesInput">Ages (comma-separated)</label>
                <input type="text" id="AgesInput" [formControl]="ages" />
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" (click)="changeRoute(this.fromLocation.value!, this.toLocation.value!, L)">Test Route</button>
                <button type="submit" class="btn btn-primary">Update Details</button>
            </div>

            <div>
                <p id="errormsg"></p>
            </div>
        </form>
    </div>
</body>
</html>
